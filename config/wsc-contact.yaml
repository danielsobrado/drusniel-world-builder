# World Surface Context (WSC) — PR 4 Contact Material Blending Profiles
# Controls height-based ground-to-object material continuity (albedo, roughness,
# slope normal, and orthogonal contact AO) consumed by `applyWorldSurfaceContact`.
# Outside each profile's contact collar, every object retains its authored material identity.
#
# PR 5: an optional `conform` block per profile drives the bounded vertex morph in
# `applyGroundContactDeform` (GroundContactDeformer.js). Bands are in prototype
# metres above the prototype's ground line; the morph fades to zero at the band top,
# is clamped to `maxOffsetMeters`, and is gated by WSC validity. Modes:
#   hug      base follows H(vertex) - H(root)                       (plants)
#   settle   only the non-planar part H(vertex) - plane(root), pull-down only,
#            over the CPU sink/tilt seat                            (boulders)
# Tree root plates stay with the CPU TreeRootFitter (least-squares plane over 37
# exact terrain samples across the real root reach, sunk below every sample), which
# already rules out floating roots; a WSC residual on trunks re-followed the same
# humps at 1 m texels and cost ~3 FPS on dense-mixed (2026-11-26 A/B).

worldSurfaceContext:
  contact:
    enabled: true
    profiles:
      tree:
        blendHeightMeters: 0.34
        blendStartMeters: -0.04
        noiseAmplitudeMeters: 0.18
        surfaceShare: 0.68
        roughnessShare: 0.85
        normalShare: 0.50
        contactAoBase: 0.10
        contactAoField: 0.24
        aoHeightMeters: 0.55
        preserveIdentity: 0.18
        conform: { enabled: false }
      rock:
        blendHeightMeters: 0.36
        blendStartMeters: -0.04
        noiseAmplitudeMeters: 0.16
        surfaceShare: 0.72
        roughnessShare: 0.85
        normalShare: 0.58
        contactAoBase: 0.10
        contactAoField: 0.22
        aoHeightMeters: 0.45
        preserveIdentity: 0.22
        conform: { enabled: true, mode: settle, bandShare: 0.2, minBandMeters: 0.08, buryMeters: 0, maxOffsetMeters: 0.3 }
      alpineRock:
        blendHeightMeters: 0.40
        blendStartMeters: -0.05
        noiseAmplitudeMeters: 0.18
        surfaceShare: 0.70
        roughnessShare: 0.85
        normalShare: 0.55
        contactAoBase: 0.10
        contactAoField: 0.20
        aoHeightMeters: 0.50
        preserveIdentity: 0.20
      understory:
        blendHeightMeters: 0.20
        blendStartMeters: -0.02
        noiseAmplitudeMeters: 0.06
        surfaceShare: 0.48
        roughnessShare: 0.70
        normalShare: 0.45
        contactAoBase: 0.08
        contactAoField: 0.22
        aoHeightMeters: 0.30
        preserveIdentity: 0.15
        conform: { enabled: true, mode: hug, bandShare: 0.55, minBandMeters: 0.12, buryMeters: 0.03, maxOffsetMeters: 0.65 }
      bushProxy:
        blendHeightMeters: 0.20
        blendStartMeters: -0.02
        noiseAmplitudeMeters: 0.06
        surfaceShare: 0.42
        roughnessShare: 0.65
        normalShare: 0.45
        contactAoBase: 0.08
        contactAoField: 0.22
        aoHeightMeters: 0.30
        preserveIdentity: 0.15
        conform: { enabled: true, mode: hug, bandShare: 0.55, minBandMeters: 0.12, buryMeters: 0.03, maxOffsetMeters: 0.65 }
      debris:
        blendHeightMeters: 0.22
        blendStartMeters: -0.045
        noiseAmplitudeMeters: 0.12
        surfaceShare: 0.78
        roughnessShare: 0.90
        normalShare: 0.72
        contactAoBase: 0.12
        contactAoField: 0.24
        aoHeightMeters: 0.28
        preserveIdentity: 0.16
      mossMound:
        blendHeightMeters: 0.10
        blendStartMeters: -0.03
        noiseAmplitudeMeters: 0.05
        surfaceShare: 0.76
        roughnessShare: 0.85
        normalShare: 0.65
        contactAoBase: 0.06
        contactAoField: 0.18
        aoHeightMeters: 0.14
        preserveIdentity: 0.15
      # Town walls (render/materials/townGroundContact.js, WSC PR 7): a splash zone, not
      # a stripe. At 0.22 m with 0.08 m of noise the B18 capture read as a ruled line.
      foundation:
        blendHeightMeters: 0.45
        blendStartMeters: -0.03
        noiseAmplitudeMeters: 0.2
        surfaceShare: 0.36
        roughnessShare: 0.75
        normalShare: 0.18
        contactAoBase: 0.10
        contactAoField: 0.22
        aoHeightMeters: 0.32
        preserveIdentity: 0.24
