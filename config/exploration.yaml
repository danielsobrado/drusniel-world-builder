# Gods' End systems adapted to canonical coordinates and bounded residency.
speedBoost:
  enabled: true
  speedMultiplier: 3
  doubleTapWindowMs: 300
freeFly:
  enabled: true
  moveSpeed: 24
  fastMultiplier: 4
  lookSensitivity: 0.003
frameBudget:
  enabled: true
  targetFps: 144
  reserveMs: 0.5
  minimumMs: 0.25
  maximumMs: 3
  maxUploadBytes: 2097152
drawPreparation:
  enabled: true
  meshesPerFrame: 2
environmentPasses:
  enabled: true
  windIntervalMs: 13.8
  windMaxDeferralMs: 14
  fieldMaxDeferralMs: 100
  preparationSliceMs: 1
  initialPassMs: 0.25
residents:
  enabled: true
  radiusMeters: 220
  maxResidents: 32
  maxPerSettlement: 22
  wanderRadius: 18
  refreshSeconds: 0.5
worldSim:
  enabled: true            # residents become the World Simulator's named people where its export covers a town
  path: world-sim          # under public/; written by the simulator's POST /api/scenarios/{id}/export/game
  nameplateMeters: 4       # how close the player must be to see who someone is
serpents:
  enabled: true
  maxResident: 2
  regionSize: 256
  loadRadius: 180
  unloadRadius: 260
  spawnChance: 0.12
  tileIds: [5, 7]
  sizeScale: 0.06
  entries: []
tour:
  enabled: true
  durationSeconds: 45
  radiusMeters: 180
  clearanceMeters: 18
  lookAheadMeters: 12
  preloadMeters: 40
mobile:
  enabled: true
  maxShortSide: 900
  requireCoarsePointer: true
  pixelRatioCap: 1
  initialQuality: low
  lookSensitivity: 0.006
recovery:
  enabled: true
treeRoots:
  enabled: true
  rootHeight: 0.25
  conformHeight: 3
  maxSlope: 1.2
  maxSink: 2
  bury: 0.12
  maxOverhang: 1
