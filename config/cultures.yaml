        - "geometric plazas"
        - "observatories"
        - "archives"
        - "laboratories"
      grammar: "Administrative centers favor measured spacing, sight lines, repeated proportions, controlled water, and inscriptions."
    settlementGrammar:
      core: "Administrative axis, temple, archive, academy, registry, market, workshops, housing."
      frontier: "Survey station and secure compound precede open growth."
      infrastructure: "Numbered streets, drains, cisterns, inspection gates, notices, and standardized measurements."
    values:
