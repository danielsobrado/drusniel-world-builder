      elf: 0.01
      dwarf: 0.01
      goblin: 0.01
      other: 0.02
    identity:
      public: "Knowledge, discipline, measurement, and safety through controlled understanding."
      admired: "Exceptional scholarship, record keeping, research, and coordination."
      ugly: "Repression, censorship, surveillance, and the assumption expertise grants moral authority."
      internalLie: "Control makes dangerous knowledge safe."
      outsiderMisconception: "Contians are simply mad mages or universally loyal servants of the theocracy."
    architecture:
