        ties:
          - "seasonal trade"
          - "mountain craft"
      vondari:
        stance: "close trade"
        pressurePoints:
          - "tolls"
          - "mining access"
        ties:
          - "caravans"
          - "pass defense"
      elenori:
        stance: "cautious affinity"
        pressurePoints:
          - "land rites"
          - "secrecy"
        ties:
          - "druidic exchange"
          - "rare plants"
      umbra-kori:
        stance: "guarded"
        pressurePoints:
          - "hidden passes"
          - "smuggling"
        ties:
          - "intelligence"
          - "depth warnings"
    visualPalette:
      - "#d4d0c7"
      - "#7d817d"
      - "#454a45"
      - "#26302c"
      - "#8a6b3f"
    storyHooks:
      - "A caravan family funds a road that would make rival valleys irrelevant."
      - "A witch and druid agree something is wrong but blame each other."
      - "A heroic battle myth conflicts with living veterans' memories."
