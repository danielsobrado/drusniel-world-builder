cultures:
  lumish:
    id: "lumish"
    displayName: "Lumish Heartlanders"
    status: "core"
    azgaarCultureIds:
      - 3
    regions:
      - "western and central Lumeshire"
      - "Imperial market corridors"
      - "fortified border towns"
    ancestryWeights:
      human: 0.94
      dwarf: 0.02
      elf: 0.01
      orc: 0.01
      goblin: 0.01
      other: 0.01
    identity:
      public: "Civilization, faith, law, duty, and protection."
      admired: "Institutions genuinely protect people and sustain roads, courts, granaries, and defenses."
      ugly: "Institutional cruelty, privilege, provincial exploitation, and hiding moral failures in procedure."
      internalLie: "Empire and faith naturally act with one purpose."
      outsiderMisconception: "Every Lumish person is a zealot or willing servant of the center."
    architecture:
      materials:
        - "pale stone"
        - "lime plaster"
        - "dark timber"
        - "slate"
        - "tile"
        - "black iron"
      forms:
        - "formal churches"
        - "fortified markets"
        - "administrative compounds"
        - "courtyard housing"
      grammar: "Imperial buildings are axial and legible; private construction becomes less formal away from administrative centers."
    settlementGrammar:
      core: "Market square, church, administrative hall, granary, watch, then residential wards."
      frontier: "Defensive earthworks and watchtowers precede monumental civic buildings."
      infrastructure: "Maintained roads, bridges, toll points, record houses, and storehouses make Imperial presence visible."
    values:
      - "duty"
      - "legal continuity"
      - "public order"
      - "service"
      - "reputation"
      - "protection of dependents"
    food:
      staples:
        - "wheat bread"
        - "barley"
        - "beans"
        - "pork"
      signatures:
        - "meat pies"
        - "sausages"
        - "hard cheese"
      constraints: "Elite tables import foods ordinary households rarely see."
    clothing:
      everyday: "Wool and linen layers, practical cloaks, leather belts."
      status: "Clerical, military, guild, and administrative rank is visible in trim and insignia."
      climate: "Heavier wool north; lighter linen in richer southern provinces."
    military:
      doctrine: "Hold roads, forts, passes, and population centers; win through logistics and layered authority."
      formations:
        - "professional infantry"
        - "provincial levies"
        - "cavalry retainers"
        - "church orders"
        - "engineers"
      strengths:
        - "logistics"
        - "fortification"
        - "replacement manpower"
      weaknesses:
        - "slow decisions"
        - "political interference"
        - "bad-news suppression"
    magic:
      attitude: "Useful when licensed, sanctified, or subordinate to recognized institutions."
      institutions:
        - "church orders"
        - "licensed court practitioners"
        - "military specialists"
      commonUses:
        - "healing"
        - "warding"
        - "investigation"
        - "logistics"
      taboos:
        - "unsanctioned necromancy"
        - "uncontrolled summoning"
        - "magic outside state or church authority"
    religion:
      traditions:
        - "Imperial church"
        - "household saints"
        - "tolerated provincial rites"
      institutions:
        - "parish clergy"
        - "monasteries"
        - "military orders"
        - "church bureaucracy"
      tensions: "Local priests may defend communities from the same central institutions they serve."
    economy:
      strengths:
        - "grain"
        - "taxation"
        - "road trade"
        - "textiles"
        - "metalworking"
      imports:
        - "mountain metals"
        - "luxury goods"
        - "rare magical materials"
        - "furs"
      exports:
        - "grain"
        - "textiles"
        - "tools"
        - "administrative services"
      labor: "Tenant farmers, freeholders, guild labor, soldiers, and clerks coexist by province."
    socialClasses:
      -
        key: "landholding-elite"
        role: "Nobility and provincial families controlling land and offices."
      -
        key: "clergy-administrators"
        role: "Priests, judges, scribes, and officials."
      -
        key: "guild-citizens"
        role: "Merchants and skilled urban craftspeople."
      -
        key: "rural-households"
        role: "Farmers, herders, and laborers carrying most tax and levy burdens."
    naming:
      personal: "Broad human pool with strong provincial variation."
      family: "Occupational, locative, patronymic, and landed-family names coexist."
      place: "Saints, founders, rivers, crossings, forts, and markets."
      notes: "Names reveal province and class more often than ancestry."
    factions:
      -
        key: "imperial-administration"
        goal: "Keep taxes, law, roads, and reporting chains functioning."
      -
        key: "church-hierarchy"
        goal: "Preserve doctrinal authority."
      -
        key: "provincial-houses"
        goal: "Keep local autonomy and wealth without losing protection."
      -
        key: "reformist-clergy"
        goal: "Make institutions live up to their public claims."
    prejudices:
      -
        toward: "zuraldarr"
        belief: "Backward highlanders resist proper administration."
        reality: "Their route knowledge is essential to Imperial trade."
      -
        toward: "norths"
        belief: "Harsh people with little law."
        reality: "Frostgard law is personal and obligation-based."
    relations:
      zuraldarr:
        stance: "semi-autonomous"
        pressurePoints:
          - "taxation"
          - "conscription"
          - "jurisdiction"
        ties:
          - "trade"
          - "mutual defense"
      contian:
        stance: "strategic rivalry"
        pressurePoints:
          - "magic regulation"
          - "doctrine"
        ties:
          - "trade"
          - "shared threats"
      norths:
        stance: "pragmatic distance"
        pressurePoints:
          - "raiding"
          - "border law"
        ties:
          - "furs"
          - "sea trade"
      vondari:
        stance: "essential trade"
        pressurePoints:
          - "tariffs"
          - "mining access"
        ties:
          - "metals"
          - "engineering"
      elenori:
        stance: "respectful suspicion"
        pressurePoints:
          - "archives"
          - "land use"
        ties:
          - "medicine"
          - "diplomacy"
      umbra-kori:
        stance: "guarded necessity"
        pressurePoints:
          - "secrecy"
          - "religious distrust"
        ties:
          - "intelligence"
          - "shared threats"
    visualPalette:
      - "#e8e1d4"
      - "#a7a29a"
      - "#565a58"
      - "#303738"
      - "#7c4e3d"
    storyHooks:
      - "A governor buries evidence of a real threat because it exposes falsified reports."
      - "A decent priest breaks Imperial law to protect a town."
      - "A road project saves lives while destroying old local autonomy."
  zuraldarr:
    id: "zuraldarr"
    displayName: "Zuraldarr"
    status: "core"
    azgaarCultureIds:
      - 6
    regions:
      - "eastern Lumeshire highlands"
      - "Zuraldi valleys"
      - "Lumeshire-Stonehold mountain passes"
    ancestryWeights:
      human: 0.97
      elf: 0.01
      dwarf: 0.01
      other: 0.01
    identity:
      public: "Autonomy, ancestry, land, route knowledge, and household obligation."
      admired: "Community resilience, mountain knowledge, and institutions that preserve local voice."
      ugly: "Insular pressure, old grudges, patronage, and exclusion of outsiders."
      internalLie: "The Zuraldarr are completely independent and never needed outside powers."
      outsiderMisconception: "They are primitive hillfolk held back by superstition."
    architecture:
      materials:
        - "gray mountain stone"
        - "lime wash"
        - "dark slate"
        - "heavy timber"
      forms:
        - "terraced farmsteads"
        - "ridge watchhouses"
        - "stone cattle yards"
        - "council halls"
      grammar: "Buildings follow slope and wind; retaining walls and terraces are civic infrastructure."
    settlementGrammar:
      core: "Council hall, spring, shared yard, ancestor place, clustered houses, cattle structures, terraces."
      frontier: "Watch posts and refuge enclosures dominate narrow passes."
      infrastructure: "Terraces, switchbacks, bridges, cairns, and route markers preserve local knowledge."
    values:
      - "autonomy"
      - "reciprocity"
      - "ancestral obligation"
      - "practical competence"
      - "bounded hospitality"
      - "land stewardship"
    food:
      staples:
        - "barley"
        - "oats"
        - "roots"
        - "milk"
        - "beef"
      signatures:
        - "smoked beef"
        - "mountain cheese"
        - "thick stews"
      constraints: "Short highland growing seasons make preservation and cattle central."
    clothing:
      everyday: "Layered wool, hard-wearing trousers and skirts, mountain cloaks, leather boots."
      status: "House and office affiliation appears through woven borders, pins, and inherited jewelry."
      climate: "Rain, wind, and altitude matter more than court fashion."
    military:
      doctrine: "Control passes, delay stronger forces, attack supply lines, and exploit terrain."
      formations:
        - "valley militias"
        - "pass wardens"
        - "mounted messengers"
        - "scouts"
      strengths:
        - "terrain knowledge"
        - "ambush"
        - "mobility"
      weaknesses:
        - "small manpower pool"
        - "council factionalism"
        - "limited siege capacity"
    magic:
      attitude: "Land, healing, weather, ancestor, and protection traditions are accepted; external licensing is distrusted."
      institutions:
        - "witch lineages"
        - "druid circles"
        - "household rites"
      commonUses:
        - "healing"
        - "weather reading"
        - "route finding"
        - "animal care"
      taboos:
        - "binding ancestors"
        - "poisoning land"
        - "seizure of sacred knowledge"
    religion:
      traditions:
        - "ancestor traditions"
        - "land and grove rites"
        - "select Imperial practices"
      institutions:
        - "spirituality office"
        - "druids"
        - "witches"
        - "household keepers"
      tensions: "Witches, druids, and Imperial priests overlap in practice but dispute authority."
    economy:
      strengths:
        - "cattle"
        - "terraced agriculture"
        - "caravan support"
        - "mountain transit"
        - "timber"
      imports:
        - "grain"
        - "urban goods"
        - "salt"
        - "cloth"
      exports:
        - "cattle"
        - "cheese"
        - "hides"
        - "timber"
        - "guides"
        - "transit access"
      labor: "Family holdings dominate while caravan houses and council routes create non-landed power."
    socialClasses:
      -
        key: "old-landholders"
        role: "Lineages with deep claims to terraces and local office."
      -
        key: "caravan-families"
        role: "Route operators whose interests often favor integration."
      -
        key: "spiritual-keepers"
        role: "Witches, druids, and ancestor authorities."
      -
        key: "free-households"
        role: "Farmers, herders, craftspeople, guides, and militia households."
    naming:
      personal: "Local human names with valley variation and reuse of ancestor names."
      family: "House, farm, valley, and maternal-line identifiers are common."
      place: "Ridges, passes, old battles, springs, and founding households."
      notes: "Valley or house affiliation can matter more than surname."
    factions:
      -
        key: "leadership-office"
        goal: "Preserve unity without allowing one office to dominate."
      -
        key: "agriculture-office"
        goal: "Protect land, water, grazing, and food security."
      -
        key: "trade-office"
        goal: "Expand caravan wealth and transit."
      -
        key: "defense-office"
        goal: "Keep militia and pass control outside foreign command."
      -
        key: "justice-office"
        goal: "Maintain local law."
      -
        key: "spirituality-office"
        goal: "Protect ancestral and land traditions."
    prejudices:
      -
        toward: "lumish"
        belief: "Lowlanders obey paper before people."
        reality: "Many officials bend rules to keep communities functioning."
