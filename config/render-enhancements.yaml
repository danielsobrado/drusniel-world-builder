# Optional quality features. These are deliberately independent of world generation.
detailVisibility: false
# Enable after snow/coast visual and hardware acceptance.
geologyLod: false
regionalGeologyAdmission: false
locationDecorationAdmission: false
geologyAdmissionBudget:
  triangleBudget: 100000
  protectMeters: 64
  minimumScaleMultiplier: 24
  maxExtraDraws: 8
  recoveryRatio: 0.85
locationDecorationBudget:
  cellMeters: 24
  protectMeters: 24
  maxDistanceMeters: 100
  triangleBudget: 60000
  drawBudget: 24
  recoveryMeters: 4
  boundsPaddingMeters: 1
  refreshMeters: 1
# Opt-in until regional visual and GPU acceptance.
regionalTerrainProfiles: false
regionalLazyTrees: false
regionalTreeSourceRelease: false
regionalResourceBudget: false
regionalDensityBudget: false
regionalSpatialBudget: false
spatialPerformanceOverlay: false
spatialOverlay:
  refreshMs: 500
  radius: 8
regionalGeometryCostBudget: false
regionalAdmissionBudget: false
rendererAdmissionBudget: false
regionalInstancePublicationBudget: false
farShadowAdmission: false
reflectionAdmission: false
townDecorationAdmission: false
environmentalParticleAdmission: false
measuredGpuAdmission: false
gpuAdmissionBudget:
  sampleEvery: 8
  maxAgeMs: 1500
  targetRenderMs: 12
  recoveryRenderMs: 9
  pressureSamples: 3
  recoverySamples: 8
  minimumDwellMs: 2000
  passMs:
    ao: 1.2
    ssr: 1.5
    bloom: 1
    shafts: 1.2
    volumetric: 1.5
atmosphericPassAdmission: false
atmosphericPassBudget:
  targetFrameMs: 18
  recoveryFrameMs: 17
  pressureMs: 300
  recoveryMs: 2000
  minimumDwellMs: 3000
  maxFrameGapMs: 250
  ssrStepFactor: 0.65
  ssrMinimumSteps: 12
  shaftSampleFactor: 0.5
  shaftMinimumSamples: 8
  volumetricStepFactor: 0.6
  volumetricMinimumSteps: 16
  aoResolutionFactor: 0.75
  aoMinimumResolution: 0.25
  reduceBloomFilter: true
environmentalFragmentAdmission: false
coastalSprayCompaction: false
environmentalFragmentBudget:
  fogStepFactor: 0.5
  fogMinimumSteps: 3
  fogProtectedDistanceMeters: 20
  frameCpuPressureMs: 12
  recoveryMs: 800
  transparentAlphaCutoff: 0.003
environmentalParticleBudget:
  particleBudget: 18000
  pressureFactor: 0.65
  frameCpuPressureMs: 12
  sampleMs: 200
  recoveryMs: 800
  protectWaterfallMeters: 60
  minimumShares:
    precipitation: 0.6
    dust: 0.5
    splash: 0.25
    waterfall: 0.25
    ambient: 0.15
townDecorationBudget:
  triangleBudget: 60000
  drawBudget: 24
  protectMeters: 100
  omitDistanceMeters: 180
  refreshMeters: 6
  recoveryRatio: 0.85
auxiliaryPassBudget:
  farShadowIntervalMs: 33
  farShadowMaxAgeMs: 100
  farShadowMoveMeters: 0.5
  farShadowTurnDegrees: 1
  farShadowSunDegrees: 0.15
  frameCpuPressureMs: 12
  cubeCaptureCpuBudgetMs: 1.5
  planarCaptureCpuBudgetMs: 2
  reflectionUrgentDeferralMs: 80
  reflectionMaxDeferralMs: 250
regionalBudget:
  idleMs: 30000
  maxTrackedTextureMiB: 256
  maxRendererMiB: 4096
  evictionsPerFrame: 1
  farGrassPressure: 0.85
  sceneryLodPressure: 0.85
  protectedChunkRadius: 1
  # Relative demand units, not measured GPU time or triangles.
  spatialChunkRadius: 8
  spatialChunkBudget: 1200
  spatialLodFactor: 0.75
  spatialCardFactor: 0.8
  spatialWorkItems: 256
  # Geometry-based pressure: estimated pass submissions, not GPU timings.
  spatialTriangleBudget: 200000
  spatialDrawBudget: 100
  spatialReflectionPassWeight: 0.25
  # Shared estimated cost across the sampled renderer window.
  rendererAdmissionTriangleBudget: 4000000
  rendererAdmissionDrawBudget: 1500
  rendererAdmissionTransitionReserve: 0.15
  rendererAdmissionUploadHeadroom: 0.5
  rendererAdmissionMaxChanges: 8
  admissionFactors: [1, 0.85, 0.7, 0.5]
  admissionPriorities:
    tree: 4
    rock: 3
    bush: 2
    card: 1
  spatialWeights:
    town: 1
    tree: 8
    rock: 3
    bush: 2
    blade: 0.01
    card: 0.15
    detail: 1
    water: 50
  sampleIntervalMs: 1000
  triangleBudget: 4000000
  drawBudget: 1500
  townInstanceBudget: 3000
  recoveryRatio: 0.75
detailTurnMarginDegrees: 12
r187:
  depthOnlyOcclusion: false
  prioritizedRequests: false
  maxConcurrentRequests: 6
  maxConcurrentDecodes: 2
  requestMaxWaitMs: 500
surfaceAnisotropy:
  enabled: true
  level: 16
waterReflections:
  enabled: true
  planar: true
  resolution: 256
  intervalMs: 500
  maxCaptureDeferralMs: 100
  reachMeters: 96
shadowCascades: 1
# Coherence-polish plan, stage 6: near tree crowns cast sun shadows, for shade
# and dapple under a wood. On since 2026-11-11 from the evenly lit forest floors
# in that day's captures, but its frame cost is NOT measured yet: A/B against
# ?crownShadows=0 at the forest and town poses. It may go a little over the
# stage budget, but turn it off if those poses do not stay above 60 FPS.
crownShadows: true
snowRelief: true
roadsideLanterns: false
