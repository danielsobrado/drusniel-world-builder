# Optional quality features. These are deliberately independent of world generation.
detailVisibility: false
# Enable after snow/coast visual and hardware acceptance.
geologyLod: false
# Opt-in until regional visual and GPU acceptance.
regionalTerrainProfiles: false
regionalLazyTrees: false
regionalTreeSourceRelease: false
regionalResourceBudget: false
regionalDensityBudget: false
regionalSpatialBudget: false
regionalGeometryCostBudget: false
regionalAdmissionBudget: false
rendererAdmissionBudget: false
regionalInstancePublicationBudget: false
regionalBudget:
  idleMs: 30000
  maxTrackedTextureMiB: 256
  maxRendererMiB: 4096
  evictionsPerFrame: 1
  farGrassPressure: 0.85
  sceneryLodPressure: 0.85
  protectedChunkRadius: 1
  # Relative demand units, not measured GPU time or triangles.
  spatialChunkRadius: 8
  spatialChunkBudget: 1200
  spatialLodFactor: 0.75
  spatialCardFactor: 0.8
  spatialWorkItems: 256
  # Geometry-based pressure: estimated pass submissions, not GPU timings.
  spatialTriangleBudget: 200000
  spatialDrawBudget: 100
  spatialReflectionPassWeight: 0.25
  # Shared estimated cost across the sampled renderer window.
  rendererAdmissionTriangleBudget: 4000000
  rendererAdmissionDrawBudget: 1500
  rendererAdmissionTransitionReserve: 0.15
  rendererAdmissionUploadHeadroom: 0.5
  rendererAdmissionMaxChanges: 8
  admissionFactors: [1, 0.85, 0.7, 0.5]
  admissionPriorities:
    tree: 4
    rock: 3
    bush: 2
    card: 1
  spatialWeights:
    town: 1
    tree: 8
    rock: 3
    bush: 2
    blade: 0.01
    card: 0.15
    detail: 1
    water: 50
  sampleIntervalMs: 1000
  triangleBudget: 4000000
  drawBudget: 1500
  townInstanceBudget: 3000
  recoveryRatio: 0.75
detailTurnMarginDegrees: 12
r187:
  depthOnlyOcclusion: false
  prioritizedRequests: false
  maxConcurrentRequests: 6
  maxConcurrentDecodes: 2
  requestMaxWaitMs: 500
surfaceAnisotropy:
  enabled: true
  level: 16
waterReflections:
  enabled: true
  planar: true
  resolution: 256
  intervalMs: 500
  maxCaptureDeferralMs: 100
  reachMeters: 96
shadowCascades: 1
# Coherence-polish plan, stage 6: near tree crowns cast sun shadows, for shade
# and dapple under a wood. On since 2026-11-11 from the evenly lit forest floors
# in that day's captures, but its frame cost is NOT measured yet: A/B against
# ?crownShadows=0 at the forest and town poses. It may go a little over the
# stage budget, but turn it off if those poses do not stay above 60 FPS.
crownShadows: true
snowRelief: true
roadsideLanterns: false
