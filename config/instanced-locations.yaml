      strata: { frequency: 0.55, warp: 5, dip: 0.05, dark: '#77777f', light: '#c5c7d2', relief: 0.8 }
      # Bioluminescent veins: in a cavern with no sky they are what shows the rock's
      # shape. At glow 0.07 the city's walls read as black (2026-11-16 captures).
      vein: { color: '#7fdcff', scale: 0.9, sharpness: 10, roughness: 0.2, f0: 0.3, glow: 0.85, floor: 0.75 }
      seam: { color: '#394055', strength: 0.68, damp: 0.35 }
    # Umbra'kor fungus-bed compost; the props' vertex tint carries the loam and its mycelium.
    fungus_loam:
