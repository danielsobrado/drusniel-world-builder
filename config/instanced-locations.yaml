        roof: { kind: stone, profile: snow_roof, masked: false }
        iron: { kind: stone, profile: iron, masked: false }
        glow: { kind: glow }
      params:
        # The ice cliff: where it stands (z), how high, how far its middle bows forward, its backward lean per metre
        # of height. The face stands in facets about `facet` metres wide, up to `setback` metres forward of or behind
        # each other: buttresses and re-entrants. Over the undercut foot between `calving` x the face leans out by
        # `overhang` per metre of height. Crevasses cut back from the lip; caveX is where meltwater bored the cave;
        # bergs calved at the foot: [x, metres out from the face, size, tilt in radians (near 1.3 lies flat)].
        front: { z: -34, height: 38, bow: 14, lean: 0.12, facet: 14, setback: 9, calving: [-48, -22], overhang: 0.26, crevasses: 8, caveX: 10, bergs: [[-18, 8, 3.2, 0.35], [27, 7, 2.8, 0.5], [-11, 16, 1.8, 0.2], [38, 9, 3.4, 1.3]] }
        # Crevasses across the flow: [fromX, toX, metres back from the lip].
        transverse: [[-48, -6, 9], [0, 46, 12], [-30, 30, 24]]
        # Between `zone` x the lip has slumped toward the face in `steps` treads, `tread` metres deep and `rise` high.
        # Towers along the lip: [x, metres back, width, thickness, height, lean toward the forefield in radians];
        # a strong lean is a serac part-way through toppling.
        seracs:
          zone: [6, 46]
          steps: 3
          tread: 7
          rise: 5
          towers: [[-44, 4, 6, 5, 12, 0.05], [-36, 11, 5, 4, 8, -0.1], [-29, 2, 8, 2.6, 11, 0.32], [-14, 6, 6, 5, 13, 0.08], [-6, 12, 5, 4, 10, 0.12], [0, 3, 6, 4.5, 9, 0.2], [15, 3, 6, 5, 10, 0.3], [22, 16, 5, 4, 9, -0.15], [29, 9, 6, 4, 12, 0.55], [44, 4, 5, 4.5, 11, 0.15]]
        # Breaking along planes: [cell metres, relief metres, stretchY]. blocks: serac blocks and rock joints;
        # planes: the fractures across every face; soffit: the flat slabs the arch's underside fails in.
        fracture: { blocks: [9, 2.2, 2.4], planes: [3.2, 0.7, 1.4], soffit: [2.4, 0.6, 0.3] }
        # The rock walls: where they stand, lean back per metre, how much craggier than ice. Bedding planes every
        # `ledge` metres up step back onto a `bench` where snow lies, dipping down-valley by `dip`, wandering by `warp`.
        wall: { x: 58, lean: 0.05, ledge: 7, bench: 1.9, dip: 0.04, warp: 6, crag: 1 }
        # The end moraine across the valley, and the lateral moraines along each wall foot (distance from the middle).
        moraine: { z: 37, height: 9, width: 7, lateral: { x: 48, height: 3, width: 6 } }
        pool: { x: -8, z: -22, rx: 22, rz: 9, y: -0.3 }
        # The frozen melt stream, a leading line: cave mouth → pool → under the arch → out across the forefield ([x, z]).
        channel: { path: [[10, -36], [6, -30], [1, -25], [-4, -21], [0, -14], [1.5, -6], [0.5, 2], [-2.5, 10], [-6, 18]], halfWidth: 1.3, bank: 1.6, depth: 0.7 }
        # The wall of old ice across the forefield: its ends (x), crest height, thickness, length of each crest step,
        # the window through it [x, y], blocks fallen from its broken east end, the cornice's reach off its lee crest,
        # and how much harder its flanks fracture than the cliff's.
        ridge: { west: -29, east: 24, height: 13, thickness: 6, block: 6, window: [-12, 7.5], debris: 7, cornice: 1.4, fracture: 1.4 }
        # The arch, through a thicker pier of ice: its half width (pier), depth through and crown height.
        arch: { x: 4, z: -6, width: 8.4, height: 9.5, pier: 9, depth: 9, crown: 17 }
        strata: { amp: 0.22, frequency: 0.3, dip: 0.08, warp: 6 }
        # Snow: metres built up on tops and ledges, on the open forefield; the wind (plan, as the atmosphere's);
        # drift tails in obstacle sizes and moat depth; the bank under the wall's lee, its reach and the gap at the arch.
        snow: { depth: 1.2, field: 0.35, wind: [0.6, 0.8], tail: 5, scour: 0.5, bank: 2.4, bankReach: 9, bankGap: 8 }
        # Boulders the ice carried down and set on the forefield: [x, z, size].
        erratics: [[-7, 15, 2.2], [17, 9, 1.5], [-24, 3, 2.8], [-38, 22, 2]]
        # Strength of the sun shafts through the old wall's openings.
        shafts: 0.08
        crystalField: { clusters: 450, needles: 700 }
        icicles: 240
        stakes: [[0.6, 20], [2.5, 14], [5.5, 4], [7, -14], [9.5, -24]]
        # A Norths waystation before the arch, and the torches at its mouth ([x, z]).
        waystation: { x: 12, z: 4, torches: [[-2.6, 0], [7.4, 0]] }
