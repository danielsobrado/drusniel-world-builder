        # Section lighting mood, deterministic lantern rhythm, and portal/cavern transitions (see generators/mineLightingLayout.js).
        lightingSections:
          adit: { daylightTint: '#b8d4f4', daylightIntensity: 3.8, daylightRange: 17.5, thresholdTint: '#8faed4', thresholdIntensity: 1.75, thresholdRange: 16.5 }
          haulage: { tint: '#ffbe7a', warmAltTint: '#ffc88a', intensity: 4.4, range: 15.0, spacingFrames: 3, unlitRate: 0.14, flickerAmount: 0.085 }
          hub: { tint: '#ffc07c', shaftAbyssTint: '#6c859c', shaftAbyssIntensity: 2.1, hoistIntensity: 5.6, hoistRange: 19.5 }
          stope: { tint: '#ffc482', workTint: '#ffb870', primaryIntensity: 5.2, primaryRange: 17.5, flickerAmount: 0.105 }
          abandoned: { tint: '#eb9e56', dimTint: '#df8d46', intensity: 2.6, range: 11.5, flickerAmount: 0.24 }
          flooded: { tint: '#ffba72', pierIntensity: 4.0, pierRange: 16.0, farIntensity: 4.0, farRange: 17.5 }
    drow_cavern_city:
      generatorKey: vertical-cavern-city
      lightingProfile: umbra_pale
      atmosphereProfile: umbra_depth
      loadingTheme: umbra_depth
      loreRealmKey: umbrakor
      voxel: 0.9
      materials:
        terrain: { kind: stone, profile: umbra_basalt }
        masonry: { kind: stone, profile: umbra_ashlar, masked: false }
        timber: { kind: stone, profile: timber, masked: false }
