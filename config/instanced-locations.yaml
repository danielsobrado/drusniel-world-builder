      scale: 1.6
      tint: '#ffffff'
      normalStrength: 0.35
      roughness: 0.96

  # Ice families: one shader (materials/GlacierIceMaterial.js), a preset each. A vertex mask
  # can push part of a wall toward another family, so one cave shows several.
  #   thinColor   aerated or thin ice, seen over a short path: pale grey-white-aqua
  #   deepColor   thick clear ice, looked into: dark slate
  #   saturation  how much colour the body keeps (1 as computed, 0 grey)
  #   absorption  per-metre rgb extinction of light inside the ice
  #   depthRate   metres of light path per metre of ice behind the surface: how fast clear ice goes dark
  #   cloud       base scatter, 0 clear .. 1 white; the layering, bubbles and crust add to it
  #   lightThrough how far a face lit through the ice (the bake's light arrives short of red) glows with that light
  #   gloss       strength of the broad wet highlight
  #   reflection  gain: the ambients scaled up to the radiance the ice mirrors; horizon: how much brighter the
  #               horizon is than the dome under an open sky
  #   crust       white weathering on faces open to the sky; snowfall: snow lying where the sky can see
  #   snowSlope   how upright a face must be (its normal's Y, from..to) before snow lies on it
  #   snowEdge    gather: how much snow prefers scallop hollows and cracks; breakup: how ragged its edge is;
  #               lip: metres of snow depth stepped up at its edge; shadow: how much the lip darkens the ice beside it
  #   wind        plan direction the snow ridges run along; drift: loose snow snaking down it under open sky
  #   translucency how strongly thin ice (icicles, fins) glows with the light around it
  #   trailColor  what trodden snow is multiplied by
  #   detailRange metres over which cracks, bubbles and sparkle fade out with distance
  #   banding     layers per metre, tilt, fold amplitude (metres of layer offset), band contrast;
  #               zones: contrast of clear and aerated lenses, zoneSize metres they run along the layers
  # Amounts are 0..1 and add to the vertex masks.
  iceProfiles:
    deep_blue_glacier: &ice
      textures: { ice: ice, cracks: ice-cracks, snow: snow }
      thinColor: '#d3e2e6'
      deepColor: '#1e3850'
      saturation: 0.75
      scatterColor: '#b9d9e6'
      sedimentColor: '#3d3a33'
      frostColor: '#e9f1f5'
      snowColor: '#f4f8fb'
      snowShade: '#b9cfe8'
      absorption: [0.42, 0.085, 0.05]
      depthRate: 1
      lightThrough: 0.5
      roughness: 0.14
      gloss: 0.3
      reflection: { gain: 3, horizon: 2 }
      microNormal: 0.16
      crackGain: 0.6
      fracture: 0.1
      bubbles: 0.08
      cloud: 0.3
      sediment: 0
      frost: 0
      snow: 0
      polish: 0
      crust: 0
      snowfall: 0
      snowSlope: [0.25, 0.65]
      snowEdge: { gather: 0.35, breakup: 0.35, lip: 0.07, shadow: 0.3 }
      wind: [0.6, 0.8]
      drift: 0
      driftSpeed: 3
      translucency: 1.2
      caustics: 0.28
      trailColor: '#a9bcd6'
      detailRange: [16, 48]
      banding: { frequency: 0.9, dip: 0.22, fold: 5, strength: 0.3, zones: 0.6, zoneSize: 24 }
      scallop: { scale: 0.6, depth: 0.26 }
    # Firn ice: so full of air it is pale through and through, matte, layered only faintly.
    white_bubbly:
      <<: *ice
      thinColor: '#e2ebee'
      deepColor: '#5d84a0'
      saturation: 0.6
      roughness: 0.3
      gloss: 0.12
      reflection: { gain: 2, horizon: 2 }
      bubbles: 0.9
      cloud: 0.8
      crackGain: 0.3
      depthRate: 0.35
      banding: { frequency: 0.9, dip: 0.22, fold: 5, strength: 0.3, zones: 0.3, zoneSize: 24 }
    # Meltwater ice: no air to scatter, so the eye refracts straight in with 3-IOR dispersion and every fracture shows.
    clear_polished:
      <<: *ice
      crystal: true
      transmission: 0.86
      refractionStrength: 0.056
      facetSharpness: 0.48
      iridescence: 0.22
      absorption: [0.64, 0.14, 0.05]
      deepColor: '#122e4a'
      saturation: 0.85
      roughness: 0.055
      gloss: 0.52
      reflection: { gain: 4.2, horizon: 2.5 }
      microNormal: 0.08
      bubbles: 0.03
      cloud: 0.02
      polish: 0.72
      crackGain: 0.55
      depthRate: 1.4
      translucency: 1.9
      banding: { frequency: 0.9, dip: 0.22, fold: 5, strength: 0.12, zones: 0.2, zoneSize: 24 }
      scallop: { scale: 0.75, depth: 0.03 }
    # Pure faceted hexagonal ice crystals & hoarfrost spires: high chromatic dispersion, crisp bevels, jewel-like iridescence.
    ice_crystal:
      <<: *ice
      crystal: true
      transmission: 0.90
      refractionStrength: 0.068
      facetSharpness: 0.78
      iridescence: 0.26
      absorption: [0.76, 0.17, 0.05]
      thinColor: '#aee8ff'
      deepColor: '#092444'
      scatterColor: '#8cdbff'
      saturation: 0.9
      roughness: 0.045
      gloss: 0.65
      reflection: { gain: 4.6, horizon: 2.6 }
      microNormal: 0.06
      bubbles: 0.05
      cloud: 0.03
      polish: 0.85
      fracture: 0.45
      crackGain: 0.82
      depthRate: 1.6
      translucency: 2.1
      banding: { frequency: 0.9, dip: 0.22, fold: 5, strength: 0.08, zones: 0.15, zoneSize: 24 }
      scallop: { scale: 0.8, depth: 0.02 }
    # Loose pieces carry little baked depth, so depthRate is high to keep them from going pale.
    fractured:
      <<: *ice
      fracture: 0.9
      crackGain: 1.1
      roughness: 0.22
      cloud: 0.2
      depthRate: 2.5
    dirty_sediment:
      <<: *ice
      thinColor: '#cfd8d6'
      deepColor: '#2a3a44'
      saturation: 0.55
      sediment: 0.8
      cloud: 0.45
      roughness: 0.34
      gloss: 0.15
      reflection: { gain: 2, horizon: 2 }
    frost_covered:
      <<: *ice
      frost: 0.75
      roughness: 0.4
    snow_covered:
      <<: *ice
      snow: 0.9
      frost: 0.3
    # A glacier under the sky: sun-cupped, crusted pale on what faces up, blue in its breaks, snow on the level.
    weathered_glacier:
      <<: *ice
      thinColor: '#dbe6ea'
      deepColor: '#284a64'
      saturation: 0.7
      absorption: [0.4, 0.08, 0.05]
      caustics: 0.22
      lightThrough: 0.3
      reflection: { gain: 4, horizon: 2.5 }
      crust: 0.6
      snowfall: 1
      # Ledges on a cliff hold little: snow wants a nearly level place to lie.
      snowSlope: [0.5, 0.85]
      drift: 0.7
      depthRate: 1.1
      cloud: 0.4
      roughness: 0.2
      detailRange: [22, 70]
      banding: { frequency: 0.9, dip: 0.22, fold: 7, strength: 0.28, zones: 0.7, zoneSize: 30 }
      scallop: { scale: 0.35, depth: 0.2 }
    # Fresh-fallen blocks: clear broken faces, a cap of new snow.
    # Blocks sawn from the working face and stacked: clear, blue, and lit like any object in the room.
    cut_block:
      <<: *ice
      cloud: 0.1
      fracture: 0.5
      crackGain: 0.9
      depthRate: 3
      lightThrough: 0
      translucency: 0.3
    calved_block:
      <<: *ice
      fracture: 0.8
      crackGain: 1
      cloud: 0.15
      depthRate: 3
      crust: 0.4
      snowfall: 0.8

  # bakeGain scales every baked lamp in the profile (default 1).
  # Colours are linear-light ambient for up- and down-facing surfaces, the walker's
  # carried lamp, and fog. absorption: how the bake dims light crossing solid.
  lightingProfiles:
    mine_lanterns:
