    royal_bronze:
      surface: iron
      scale: 0.78
      tint: '#e2b45c'
      normalStrength: 0.95
      roughness: 0.34
      metalness: 0.88
      f0: 0.78
      patina: { color: '#5c4628', amount: 0.14, spread: 0.25 }
    stonehold_alpine_rock:
