      scale: 0.5
      tint: '#5d5a4c'
      normalStrength: 1.1
    iron:
      surface: iron
      scale: 0.9
      tint: '#9aa0ab'
      normalStrength: 1.05
      roughness: 0.52
      metalness: 0.7
      f0: 0.44
      seam: { color: '#454340', strength: 0.62, soot: 0.35 }
    mine_iron:
      surface: iron
      scale: 0.9
      tint: '#c4cad6'
      normalStrength: 1.05
      roughness: 0.46
      metalness: 0.42
      f0: 0.52
      forgedPatina: true
