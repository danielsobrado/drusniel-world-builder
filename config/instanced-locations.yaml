      exposure: 1.18
      bakeGain: 2.15
      dynamicGain: 0.26
      indirectBounce: { strength: 0.66, cellSize: 1.25, radius: 13.0, wrap: 0.54, maxEnergy: 2.2 }
      propShadows: { resolution: 0.16, minTransmit: 0.12, contactStrength: 0.76 }
      absorption: { rock: [6, 6, 6], ice: [0.55, 0.085, 0.03] }
