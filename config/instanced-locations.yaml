      scale: 0.55
      tint: '#dfd4c6'
      normalStrength: 0.92
      roughness: 0.94
      woodGrain: true
      seam: { color: '#4c453c', strength: 0.68, damp: 0.32 }
    mine_timber:
      surface: timber
      scale: 0.55
      tint: '#ebe0d2'
      normalStrength: 0.95
      roughness: 0.92
      woodGrain: true
      contactDust: true
      seam: { color: '#574c3f', strength: 0.78, damp: 0.42 }
    sod_roof:
