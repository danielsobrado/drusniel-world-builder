    rubble_masonry:
      surface: rubble
      scale: 0.42
      tint: '#ffffff'
      normalStrength: 1.1
      seam: { color: '#5b5852', strength: 0.68, damp: 0.25 }
    glacier_bedrock:
      surface: frost-rock
      scale: 0.22
      tint: '#8f9299'
      normalStrength: 1.2
      strata: { frequency: 0.7, warp: 4, dip: 0.15, dark: '#8c8c92', light: '#e6e2dc', relief: 1.2 }
      seam: { color: '#b7c7d6', strength: 0.58, frost: 0.75 }
    # Frostgard under the sky. `snow` lies on faces at least `from` upright (the normal's Y)
    # that the sky can see; nothing under a roof or inside a hall takes any. `rime` is the
    # frost that greys whatever stands in the weather, 0..1.
    frost_timber:
      surface: timber
      scale: 0.55
      tint: '#ffffff'
      roughness: 0.88
      snow: { amount: 1, from: 0.45, color: '#eef4fa', rime: 0.3 }
      seam: { color: '#c4d2df', strength: 0.55, frost: 0.7 }
    snow_roof:
      surface: timber
      scale: 0.5
      tint: '#5d5a4c'
      normalStrength: 1.1
      snow: { amount: 1, from: -0.1, color: '#f2f6fb' }
    snowy_rubble:
