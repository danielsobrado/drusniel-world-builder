      generatorKey: glacial-cavern
      lightingProfile: frostgard_ice
      atmosphereProfile: frostgard_cold
      loadingTheme: frostgard_ice
      loreRealmKey: frostgard
      voxel: 0.5
      materials:
        terrain: { kind: ice, profile: deep_blue_glacier, bedrock: glacier_bedrock }
        clearIce: { kind: ice, profile: clear_polished, masked: false }
        iceCrystal: { kind: ice, profile: ice_crystal, masked: false }
        iceBlock: { kind: ice, profile: fractured, masked: false }
        timber: { kind: stone, profile: timber, masked: false }
        iron: { kind: stone, profile: iron, masked: false }
        masonry: { kind: stone, profile: rubble_masonry, masked: false }
        roof: { kind: stone, profile: sod_roof, masked: false }
        seal: { kind: stone, profile: obsidian_seal, masked: false }
        glow: { kind: glow }
      params:
        # Reinvests grass-free mountain budget into GPU-instanced geological crystal colonies & hoarfrost skirts.
        crystalField: { clusters: 650, needles: 900 }
        # Attempts; a cluster hangs wherever one finds a roof low enough.
        icicles: 420
        longhall: { length: 13, width: 6, wallHeight: 2.6, roofRise: 3.4 }
        # Ledges melted along the layers of the hall's walls (not the tube or pillars): metres of relief,
        # layers per metre, tilt, waviness.
        strata: { amp: 0.3, frequency: 0.22, dip: 0.12, warp: 4 }
        # The meltwater tube, keyed by metres in from the mouth: [metres, half-width of the slot the stream
        # cut at its floor, how deep it cut, half-width and half-height of the older tube over it, that
        # tube's offset to one side]. `trail` caps the walked half-width, `wobble` lets the bore drift from
        # the keys over metres, `lean` tilts the slot (metres per metre); scallops are eddy dishes, metres.
        tube:
          keys: [[0, 3.4, 0.3, 6.2, 3.4, 0], [9, 2.6, 0.9, 4.4, 3, 0.7], [17, 2.4, 1.6, 3.6, 2.6, -0.8], [24, 3.4, 2, 5.6, 3.6, 1.4], [31, 2.2, 2.4, 3.4, 2.4, -0.5], [36, 1.4, 3.4, 2, 1.6, 0.5], [39, 1.15, 4.6, 1.3, 1.1, 0.4], [53, 1.15, 4.8, 1.4, 1.2, -0.4], [58, 1.9, 3.6, 2.6, 2, 0], [63, 3.2, 2, 4.5, 3, 0]]
          trail: 1.5
          wobble: 0.12
          lean: 0.14
          scallops: { size: 2.2, depth: 0.3 }
        # Breaks, [metres of relief, metres per block, height over width]: sheer columns on the crevasse's
        # walls and the pillars; layered steps on the hall's walls and the tube's spalled roof.
        fracture: { columns: [0.5, 1.6, 2.6], layers: [0.45, 2.4, 0.45] }
        # Snow lying, metres: drifted in at the mouth, fallen down the crevasse, down the moulin.
        snow: { mouth: 1.3, crevasse: 0.8, moulin: 1.1 }
        # Ice mounds left on the hall floor where nobody walks.
        hummocks: 10
        # Daylight, [strength, reach in metres]: in at the mouth, and down the crevasse into the hall.
        daylight: { mouth: [1.8, 34], crevasse: [1, 36] }
        # Daylight through thin ice: metres of ice left over each hollow it glows through, then
        # [strength, reach] at the moulin, the fall's chimney, the squeeze's end and over the refuge.
        glow: { ice: 2.4, moulin: [1.6, 16], fall: [1.5, 18], squeeze: [1.3, 12], refuge: [0.9, 22] }
