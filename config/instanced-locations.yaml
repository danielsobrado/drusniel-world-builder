      floorSurface: flagstone
      floorScale: 0.34
      floorTint: '#9aa0ac'
      floorRoughness: 0.86
      scale: 0.16
      tint: '#4d5563'
      normalStrength: 1.55
      roughness: 0.92
      cavityShade: 0.92
      strata: { frequency: 0.52, warp: 3.4, dip: 0.18, dark: '#363d48', light: '#7b8390', relief: 1.65 }
      snow: { from: 0.50, amount: 0.82, rime: 0.16, color: '#edf3fa' }
    stonehold_alpine_carved:
      surface: dressed-stone
      scale: 0.44
      tint: '#b8bec8'
      normalStrength: 1.45
      roughness: 0.80
