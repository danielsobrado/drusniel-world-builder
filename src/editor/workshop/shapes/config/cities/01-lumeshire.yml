# Lumeshirean Divine Empire — the paladin heartland (docs/asset-bible/regions/lumeshire.md).
# Pale dressed stone and lime plaster, dark oak frames, tight slate gables, institutional
# monuments above the houses. Same soft diorama language as the craft workshops: rounded
# corners, swept and slightly sagging roofs, stone plinths, shutters, window boxes and ivy.
#
# Openings and features may give `side` (front/back/left/right) and `along` (metres to the
# viewer's right, or a list for a row) instead of `at`; the generator resolves them.
# Regenerate with `npm run generate:workshop-castle`.
group: Lumeshire · paladin empire
styles:
  house: &house { kind: curved-volume, surface: plaster, facade: timber, thickness: 0.3, shutters: true, windowBoxes: true, chimney: true, ivyDensity: 0.45, age: 0.28, base: { style: plinth, height: 0.68, out: 0.1 } }
  hall: &hall { kind: curved-volume, surface: masonry, stonework: ashlar, thickness: 0.5, shutters: false, windowBoxes: false, chimney: false, ivyDensity: 0.35, age: 0.3, base: { style: plinth, height: 0.68, out: 0.14 } }
  shed: &shed { kind: curved-volume, surface: planks, thickness: 0.16, chimney: false, windowBoxes: false, age: 0.45 }
# Materials: recipe bases (stone palette, plaster finish, roof character) plus per-surface
# tints and surface response, see cities/ShapeCityPalette.js. Tints multiply, so keep them light.
palette:
  recipe: { style: limestone, finish: limewash, topStyle: slate, weathering: 0.3, irregularity: 0.4 }
  plaster: { color: "#ede4cf", roughness: 0.96, label: Limewash }
  masonry: { color: "#cdbf9e", roughness: 0.88, label: Pale limestone }
  planks: { color: "#8c6648", label: Oak boards }
  roof: { color: "#3e5569", roughness: 0.78, label: Blue slate }
  trim: { color: "#c6b796", label: Dressed limestone }
  timber: { color: "#583a27", label: Dark oak }
  metal: { color: "#2e3033", label: Forged iron }
  glass: { color: "#3d5866", label: Leaded glass }
style:
  details: [windows, hood, dormers, oriel]
  surroundings: [path, yard, well, woodshed]
  yard: { surface: masonry, height: 1.1, depth: 4.6 }
  surface: plaster
  facade: timber
  roof: { family: gable, pitch: 0.62, overhang: 0.5, sweep: 0.45, sag: 0.1 }
  door: arched
  tower: { surface: masonry, stonework: ashlar, footprint: oval, roof: cone }
  wall: { surface: masonry, stonework: ashlar, crown: { style: parapet, height: 0.7, merlonWidth: 0.85, merlonGap: 0.5, merlonHeight: 0.75 } }
kit:
  - { id: lumeshire-house-cottage, label: "House · Limewashed cottage", blueprint: house-cottage }
  - { id: lumeshire-house-townhouse, label: "House · Jettied townhouse", blueprint: house-townhouse }
  - { id: lumeshire-house-double, label: "House · Paired burgher houses", blueprint: house-double }
  - { id: lumeshire-house-courtyard, label: "House · Courtyard house", blueprint: house-courtyard }
  - { id: lumeshire-house-tower, label: "House · Knight's tower house", blueprint: house-tower, style: { surface: masonry, stonework: ashlar } }
  - { id: lumeshire-house-hillside, label: "House · Terrace house over a cellar", blueprint: house-hillside }
  - { id: lumeshire-farm-farmstead, label: "Farm · Imperial farmstead", blueprint: farm-farmstead }
  - { id: lumeshire-farm-barnyard, label: "Farm · Tithe barn and granary", blueprint: farm-barnyard }
  - { id: lumeshire-farm-croft, label: "Farm · Smallholder's croft", blueprint: farm-croft }
  - { id: lumeshire-inn-roadside, label: "Inn · Pilgrims' roadside inn", blueprint: inn-roadside }
  - { id: lumeshire-inn-tavern, label: "Inn · Corner tavern", blueprint: inn-tavern }
  - { id: lumeshire-inn-lodge, label: "Inn · Galleried coaching lodge", blueprint: inn-lodge }
  - { id: lumeshire-shop-general, label: "Shop · Chandler's store", blueprint: shop-general }
  - { id: lumeshire-shop-baker, label: "Shop · Bakery with bread oven", blueprint: shop-baker }
  - { id: lumeshire-shop-corner, label: "Shop · Draper's corner shop", blueprint: shop-corner }
  - { id: lumeshire-shop-stalls, label: "Shop · Market stalls", blueprint: shop-stalls }
  - { id: lumeshire-shop-warehouse, label: "Shop · Merchant warehouse", blueprint: shop-warehouse }
  - { id: lumeshire-tower-watch, label: "Tower · Round watchtower", blueprint: tower-watch }
  - { id: lumeshire-tower-keep, label: "Tower · Paladin keep", blueprint: tower-keep, style: { tower: { stonework: ashlar } } }
  - { id: lumeshire-tower-signal, label: "Tower · Beacon tower", blueprint: tower-signal }
  - { id: lumeshire-wall-town, label: "Wall · Crenellated town wall", blueprint: wall-town }
  - { id: lumeshire-wall-garden, label: "Wall · Cloister garden walls", blueprint: wall-garden }
  - { id: lumeshire-wall-retaining, label: "Wall · Terrace retaining wall", blueprint: wall-retaining }
  - { id: lumeshire-stair-switchback, label: "Stairs · Switchback steps", blueprint: stair-switchback }
  - { id: lumeshire-stair-bridge, label: "Stairs · Arched footbridge", blueprint: stair-bridge }
  - { id: lumeshire-stair-grand, label: "Stairs · Processional stair", blueprint: stair-grand }
  - { id: lumeshire-house-row, label: "House · Burghers' row", blueprint: house-row }
  - { id: lumeshire-plaza-fountain, label: "Plaza · Fountain square of the Divine Light", blueprint: plaza-fountain }
  - { id: lumeshire-plaza-market, label: "Plaza · Market cross square", blueprint: plaza-market }
presets:
  - id: lumeshire-paladin-chapterhouse
    label: "Landmark · Paladin chapterhouse with oath tower and drill yard"
    primitives:
      - <<: *hall
        id: chapter-hall
        label: Chapter hall
        footprint: { family: rounded, width: 11, depth: 6.4, cornerRadius: 0.3 }
        height: 5.4
        roof: { family: gable, rise: 3.9, overhang: 0.4, sweep: 0.3, sag: 0.06 }
        openings:
          - { id: great-door, role: door, profile: pointed, side: front, along: 0, bottom: 0, width: 1.6, height: 3 }
          - { id: nave-window, role: window, profile: pointed, side: front, along: [-3.6, -2, 2, 3.6], bottom: 1.6, width: 0.7, height: 2.4 }
          - { id: back-window, role: window, profile: pointed, side: back, along: [-3, 0, 3], bottom: 1.6, width: 0.7, height: 2.4 }
          - { id: gable-rose, role: window, profile: arched, side: right, along: 0, bottom: 3.4, width: 1.2, height: 1.4 }
        features:
          - { id: front-buttress, kind: buttress, side: front, along: [-4.6, -2.8, 2.8, 4.6], width: 0.6, depth: 0.85, height: 4.2 }
          - { id: back-buttress, kind: buttress, side: back, along: [-4.6, -1.5, 1.5, 4.6], width: 0.6, depth: 0.85, height: 4.2 }
          - { id: door-porch, kind: porch, side: front, along: 0, width: 2.8, depth: 1.6, height: 3.3 }
      - <<: *hall
        id: oath-tower
        label: Oath tower
        position: [-7.4, -0.6]
        footprint: { family: rounded, width: 4.2, depth: 4.2, cornerRadius: 0.2 }
        height: 11
        levels: 3
        roof: { family: spire, rise: 6.2, overhang: 0.35, sweep: 0.35 }
        crown: { style: corbelled, projection: 0.35, height: 0.8, corbelSpacing: 0.7, arcade: pointed }
        openings:
          - { id: door, role: door, profile: pointed, side: front, along: 0, bottom: 0, width: 1.1, height: 2.3 }
          - { id: bell-front, role: window, profile: pointed, side: front, along: 0, bottom: 7.4, width: 0.9, height: 1.8 }
          - { id: bell-left, role: window, profile: pointed, side: left, along: 0, bottom: 7.4, width: 0.9, height: 1.8 }
          - { id: slit, role: slit, profile: square, side: left, along: 0, bottom: 3.6, width: 0.14, height: 1.3 }
      - id: drill-yard
        label: Drill yard wall
        kind: curved-wall
        surface: masonry
        stonework: ashlar
        position: [1.2, 8.4]
        length: 14
        bend: -1.6
        height: 1.4
        thickness: 0.5
        openings:
          - { id: yard-gate, role: arch, profile: pointed, at: 0.5, bottom: 0, width: 2.4, height: 1.4 }
      - id: hall-steps
        label: Hall steps
        kind: traversal
        position: [0, 5.1]
        rotation: -90
        length: 2
        width: 2.6
        rise: 0.5
        mode: stairs

