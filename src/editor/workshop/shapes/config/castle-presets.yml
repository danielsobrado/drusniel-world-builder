# Fortification starting designs. Every preset is plain shape-primitive data: the same
# curved-volume / curved-wall capabilities, profiles, crowns, turrets and openings a user
# can author by hand. Regenerate with `npm run generate:workshop-castle`.
#
# Closed oval footprints run +x (at 0) -> +z (0.25) -> -x (0.5) -> -z (0.75).
presets:
  - id: round-watchtower
    label: Round medieval watchtower
    primitives:
      - id: watchtower
        label: Round watchtower
        kind: curved-volume
        surface: masonry
        stonework: ashlar
        shutters: false
        craft: false
        height: 9.5
        thickness: 0.45
        footprint: { family: oval, width: 5.2, depth: 5.2 }
        roof: { family: flat }
        base: { style: batter, height: 1.7, out: 0.35 }
        crown: { style: parapet, height: 0.7, merlonWidth: 0.8, merlonGap: 0.5, merlonHeight: 0.75 }
        openings:
          - { id: door, role: door, profile: pointed, at: 0.25, bottom: 0, width: 1.05, height: 2.2 }
          - { id: loop-low, role: slit, profile: square, at: 0.05, bottom: 2.6, width: 0.13, height: 1.3 }
          - { id: loop-mid, role: slit, profile: square, at: 0.42, bottom: 4.6, width: 0.13, height: 1.3 }
          - { id: window-high, role: window, profile: pointed, at: 0.25, bottom: 6.2, width: 0.6, height: 1.5 }

  - id: square-defensive-tower
