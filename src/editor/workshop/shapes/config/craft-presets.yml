# Craft workshop starting designs. Every preset is plain shape-primitive data over the same
# curved-volume / curved-wall / traversal capabilities a user can author by hand.
# Regenerate with `npm run generate:workshop-castle`.
#
# Rounded footprints run `at` back (-z) -> right (+x) -> front (+z) -> left (-x);
# oval footprints run +x (0) -> +z (0.25) -> -x (0.5) -> -z (0.75).
