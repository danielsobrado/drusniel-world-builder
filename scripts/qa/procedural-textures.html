<!doctype html><html><head><link rel="icon" href="data:,"></head><body style="margin:0;background:#18222a"><script type="module">
import * as THREE from 'three/webgpu';
import { float, uniform, uv, vec2, vec3, normalView } from 'three/tsl';
import { getSurfaceMaterial } from '/src/editor/assets/proceduralSurfaces.js';
import { createFallingLeavesMaterial, createFallingLeavesUniforms } from '/src/editor/stylized/leaves/fallingLeavesMaterial.js';
import { createLeafGeometry } from '/src/editor/stylized/leaves/FallingLeaves.js';
import { createSeaDetailNodes } from '/src/editor/stylized/SeaDetailShading.js';
import { createSnowDetailNodes } from '/src/editor/stylized/SnowDetailShading.js';
import { createGrassAtlasTexture } from '/src/editor/assets/godsEnd/grassAtlas.js';
window.__textureQa = { status: 'loading' };
try {
 const renderer = new THREE.WebGPURenderer({ antialias: true });
 renderer.setSize(1200, 850); renderer.setPixelRatio(1); renderer.toneMapping=THREE.ACESFilmicToneMapping;
 document.body.append(renderer.domElement); await renderer.init();
 const scene=new THREE.Scene(); scene.background=new THREE.Color('#18222a');
 const camera=new THREE.PerspectiveCamera(42,1200/850,.01,100);camera.position.set(0,0,16);
 scene.add(new THREE.HemisphereLight(0xddeaff,0x887766,2));
 const light=new THREE.DirectionalLight(0xffffff,3);light.position.set(3,4,8);scene.add(light);
 const names=['stoneBlock','darkStone','plaster','timber','plank','deck','roofTile','shingle','window'];
 names.forEach((name,i)=>{
   const mesh=new THREE.Mesh(new THREE.PlaneGeometry(2.7,2.25),getSurfaceMaterial(name));
   mesh.position.set((i%3-1)*3.2,2.5-Math.floor(i/3)*2.7,0);scene.add(mesh);
 });
 const snowMaterial=new THREE.MeshStandardNodeMaterial();
 const snow=createSnowDetailNodes({terrainUv:uv(),chunkWorldSize:8,chunkCenter:uniform(new THREE.Vector2(4194304,-2097152)),snow:uv().x,material:snowMaterial});
 snowMaterial.colorNode=snow.color(vec3(.8,.84,.9));snowMaterial.normalNode=snow.normal(normalView);snowMaterial.roughnessNode=snow.roughness(float(.9));
 const snowMesh=new THREE.Mesh(new THREE.PlaneGeometry(2.7,2.25),snowMaterial);snowMesh.position.set(6.2,2.5,0);scene.add(snowMesh);
 const sea=createSeaDetailNodes({patternXZ:uv().mul(8),time:uniform(0),choppiness:4,strength:float(1)});
 const seaMaterial=new THREE.MeshBasicNodeMaterial();seaMaterial.colorNode=vec3(sea.slope.add(.5),.6);
 const seaMesh=new THREE.Mesh(new THREE.PlaneGeometry(2.7,2.25),seaMaterial);seaMesh.position.set(6.2,-.2,0);scene.add(seaMesh);
 const uniforms=createFallingLeavesUniforms({boxSize:2,boxHeight:2});uniforms.amount.value=1;
 const leaves=createFallingLeavesMaterial(uniforms,{size:.8,fallSpeed:1,palette:null});
 const leafSeeds=[.05,.4,.05,.1, .5,.5,.5,.2, .95,.6,.95,.3];
 let seedIndex=0;
 const leafMesh=new THREE.Mesh(createLeafGeometry(3,()=>leafSeeds[seedIndex++]),leaves);leafMesh.position.set(6.2,-2.9,0);scene.add(leafMesh);
 const grass=createGrassAtlasTexture();
 const grassMesh=new THREE.Mesh(new THREE.PlaneGeometry(2,2),new THREE.MeshBasicNodeMaterial({map:grass,transparent:true}));grassMesh.position.set(-6,2,0);scene.add(grassMesh);
 camera.position.x=1.2;camera.position.z=21;
 await renderer.compileAsync(scene,camera);
 for(let i=0;i<120;i++){await renderer.renderAsync(scene,camera);await new Promise(r=>requestAnimationFrame(r));}
 window.__textureQa={status:'done',webgpu:renderer.backend.isWebGPUBackend,calls:renderer.info.render.calls,textures:renderer.info.memory.textures};
} catch(error) { window.__textureQa={status:'error',error:error.stack}; }
</script></body></html>
