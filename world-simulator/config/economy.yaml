# Production, markets, prices and caravans (PR4).
# Production lines, recipes, consumption and outside trade come from the Azgaar map's
# burg production and deals; every number below is an authored assumption, not
# calibrated data. Changing them needs no code change; the state checksum changes with them.
schemaVersion: 1

azgaar:
  turnDays: 30                  # one Azgaar production or deal turn is read as a month of flow

food:
  good: Rations                 # the staple diet, counted in daily rations (not an Azgaar good)
  # Rural cells within this radius (map px) whose nearest settlement is this one feed it.
  hinterlandRadiusPx: 30
  ruralSurplusPerPersonDay: 0.2 # rations a rural inhabitant sends to town beyond their own needs
  granary: { initialDays: 60, targetDays: 60 }   # starting at the target avoids a first-month rush
  basePrice: 0.6                # value per 1,000 rations (Azgaar grain trades near 0.55 a wain)
  priceUnit: 1000

settlement:
  targetMonths: 1.5             # stock kept of every good a settlement consumes or works up

market:
  targetMonths: 2               # stock a market wants, in months of demand
  maxStockMonths: 12            # stock beyond this leaves the region
  initialRationDays: 15         # market granary at baseline, in days of member demand
  priceElasticity: 0.6          # price factor = (wanted stock / stock) ^ this
  # Outside sellers and buyers scale their Azgaar-recorded flows by (price / base) ^ these.
  outsideElasticity: { supply: 0.5, demand: 0.5 }
  priceBounds: [0.25, 4.0]      # price factor range against the Azgaar base price
  priceSmoothing: 0.5           # share of the gap to the new price closed each month
  maxPricePoints: 121           # newest monthly price points kept per market

caravans:
  milesPerDay: 20
  offRoadFactor: 1.5            # straight-line distance multiplier where no road connects
  maxDelivered: 200             # delivered caravans kept in the log

shortage:
  threshold: 0.95               # obtained / wanted below this is reported as a shortage

famine:
  mortality: 3.0                # death rates x (1 + mortality x last month's food shortfall)

# Roads, bandits, caravan guards and traders (PR4b).
bandits:
  markerRadiusPx: 25            # an Azgaar "brigands" marker this close to a road's ends founds a band there
  markerBand: 24                # bandits such a band starts with; it never shrinks below a third of this
  recruitPerUnemployed: 0.02    # share of a settlement's people without work who take to its road each month
  hungerRecruitment: 4          # recruitment x (1 + this x last month's food shortfall)
  lootRecruitment: 0.02         # extra recruits per unit of value looted last month
  patrolPerSecurityWorker: 0.002   # share of bandits removed each month per security worker at the road's ends
  maxPatrolShare: 0.5
  desertion: 0.03               # share of bandits who drift away each month
  raidPerBanditDay: 0.002       # raid chance = 1 - exp(-this x bandits x days / (1 + deterrence x guards))
  guardDeterrence: 0.5
  lootShare: 0.6                # cargo taken from an unguarded caravan; less as guards outnumber bandits
  guardStrength: 1.5            # one guard counts as this many bandits when cargo is fought over

escorts:                        # caravan-guard companies, sized each month to the guards traders hired
  label: Caravan guards
  profession: caravan guard
  staff: 6
  wage: 5                       # copper per worker-day, like other businesses
  base: 2                       # guards a fully cautious trader takes on an empty road
  perBandit: 0.4                # extra guards per bandit on the road, scaled by caution
  feePerGuardDay: 0.05          # value a settlement pays per guard per day on the road (both ways)

traders:
  perRoute: 3                   # caravan masters per road at baseline
  commission: 0.03              # of the declared value they deliver
  reputation: { start: 50, safeTrip: 2, raided: -3, caught: -15, dismissBelow: 15 }

smuggling:
  defaultTaxRate: 0.08          # where Azgaar records no taxed sale of a good
  inspection: 0.3               # catch chance = this x the centre's safety (max 1.5) x sqrt(hidden share)
  maxHidden: 0.8
  fineMultiplier: 3             # fine = this x the tax the trader tried to evade
  learning: 0.5                 # each time caught, a trader hides this much less
