# Scenario engine configuration (PR2). Paths are relative to world-simulator/.
schemaVersion: 1

storage: data/scenarios            # one folder per scenario; git-ignored

calendar:
  daysPerMonth: 30
  monthsPerYear: 12
  startYear: source                # "source" = Azgaar settings.options.year (1212 on Eldara)

stepSizes: { day: 1, week: 7, month: 30, year: 360 }
speeds: [1, 7, 30, 120]            # simulated days per real second while running
runner:
  tickSeconds: 0.25                # how often a running scenario advances

limits:
  maxScopeSettlements: 120
  maxStepDays: 3600
  maxScenarios: 50
  maxSnapshots: 50
  maxEvents: 1000
  maxHistoryPoints: 1201          # baseline + 100 years of month closes; older points are dropped

baseline:                          # created on first start if no scenario exists
  id: baseline-pilot
  name: Pilot baseline
  description: The three pilot settlements from the audit, as imported.
  scope: { type: pilot }
  seed: 1212

# Monthly demography. These rates are authored assumptions for a pre-modern world,
# not calibrated data; PR3+ replaces them with household-level simulation.
demography:
  initialShares: { children: 0.33, adults: 0.55, elders: 0.12 }
  birthsPerAdultPerYear: 0.065
  deathRatePerYear: { children: 0.035, adults: 0.012, elders: 0.07 }
  bandYears: { children: 15, adults: 45 }   # years spent in a band before ageing out

# Migration is constrained by reachable roads, ports and available housing.
migration:
  shareOfIdlePerMonth: 0.04
  minRateGap: 0.01
  settlementSharePerMonth: 0.025
  vacantHousingShare: 0.65
  householdSize: 4
  minBenefit: 0.025

travel:
  walkingMilesPerDay: 12
  shipMilesPerDay: 60
  maxDays: 60
  portTransferDays: 0.25
  mountainHeight: 60
  mountainPenalty: 0.012
  maxCompleted: 240
  newsPerSettlement: 24
  newsPerTrip: 8
  stormChance: 0.08
  closureChance: 0.04
  banditChancePerBandit: 0.002
  delays: { storm: 4, road-closure: 3, bandits: 2 }

# Seasonal yield curves and weather assumptions, indexed over a year.
climate:
  enabled: true
  seasons: [winter, winter, spring, spring, spring, summer, summer, summer, autumn, autumn, autumn, winter]
  defaultProfile: temperate
  biomeProfiles:
    desert: arid
    tundra: cold
    glacier: cold
    taiga: cold
    snowy: cold
    wetland: humid
    swamp: humid
    rainforest: humid
    tropical: humid
    savanna: warm
    grassland: temperate
    forest: temperate
  profiles:
    temperate: [0.45, 0.55, 0.85, 1.10, 1.35, 1.50, 1.45, 1.30, 1.15, 0.95, 0.75, 0.60]
    warm: [0.75, 0.80, 1.00, 1.10, 1.20, 1.25, 1.20, 1.15, 1.05, 1.00, 0.90, 0.80]
    cold: [0.20, 0.20, 0.40, 0.75, 1.20, 1.65, 1.70, 1.45, 1.05, 0.65, 0.35, 0.20]
    humid: [0.95, 0.95, 1.00, 1.05, 1.10, 1.10, 1.05, 1.00, 0.95, 0.95, 0.95, 0.95]
    arid: [0.60, 0.65, 0.85, 1.05, 1.15, 1.15, 1.10, 1.00, 0.90, 0.80, 0.70, 0.65]
  rainfallVariability: 0.36
  rainfallSensitivity: 0.65
  droughtThreshold: 0.70
  floodThreshold: 1.32
  minimumYield: 0.12
  maximumYield: 1.80

# Persistent characters (PR5): each settlement keeps exactly its NPC budget alive
# (config/npc-population.yaml). Rates are authored assumptions.
people:
  namePool: { given: 60, family: 30, maxLength: 9 }   # names per settlement, from its culture's Azgaar name base
  ages: { child: [0, 14], adult: [15, 59], elder: [60, 80] }
  traderAges: [22, 55]
  childrenPerFamily: [1, 3]
  pregnancyMonths: 9          # a named child comes this long after the marriage, and after the mother's last child
  retireFrom: 60
  retireChance: 0.75            # once, at 60, for a worker
  findWorkPerMonth: 0.25        # x the settlement's employment rate
  loseWorkPerMonth: 0.05        # x the settlement's unemployment rate
  outlaw: { idleMonths: 3, maxHonesty: 0.35, minGreed: 0.55, chance: 0.2, giveUpPerMonth: 0.03 }
  prisonDays: 360
  # Families and relationships (PR6). A named death or birth is drawn from the town's actual
  # deaths and births that month; a vacancy is filled by an anonymous inhabitant coming into focus.
  maxOverBudget: 0.25           # named children of named couples may lift a town this far over its budget
  parentMinAge: 16
  marryFromAge: 18
  marryUntilAge: 40
  partnerAgeGap: 6              # years either side of a partner's age
  marriagePerMonth: 0.02        # chance for an unmarried adult to marry a suitable single that month (x3 for a friend)
  workFromAge: 14
  maxTenureYears: 25
  apprenticeUntilAge: 20        # a worker this young has a mentor of the same trade at the same business, if one is named
  coworkerFriendship: 0.15      # chance two named co-workers start out as friends
  friendshipPerMonth: 0.01      # chance co-workers of a year or more become friends that month
  moveScale: 1.5                # a named idle adult moves with the town's outflow x (moveScale - caution)
  # Origins and reconstructed pasts (PR6). Generated facts are labelled generated-prehistory.
  originLocalShare: 0.7         # adults born in the town they live in; the rest in a nearby town of the same culture
  originCandidates: 6
  apprenticeTrades: [artisan, smith, carpenter, baker, tailor, healer, merchant, trader, innkeeper, cleric]
  apprenticeFromAge: 12
  apprenticeYears: 3
  moveAge: [16, 25]
  lostParentFromAge: 30         # an adult this old without a named parent may have lost one (chance = age / 100)
  knowledge:
    maxEntries: 40              # stored second-hand knowledge per person (newest kept); first-hand is derived
    minImportance: 3            # events worth telling
    told: 0.9                   # confidence when told by someone who was there
    friend: 0.8
    rumour: 0.6                 # carried along a road by a caravan master
    rumourMinImportance: 4      # only weighty news travels the roads (raids, arrests, deaths), not every new market stall
    outdatedAfterDays: 1080
  # Biography context (PR6.6): how much each tier gets; targets, not caps on what can happen.
  biography:
    tiers:
      basic:    { facts: [3, 5],  milestones: [2, 5],   words: [60, 100] }
      standard: { facts: [5, 8],  milestones: [5, 10],  words: [100, 180] }
      major:    { facts: [8, 15], milestones: [10, 25], words: [180, 350] }
    majorFromTimeline: 10       # a timeline this long makes anyone major; caravan masters always are
    settlementHistory: 8        # notable town events in the context
  # How experience changes people: kind -> role (or any) -> trait deltas.
  experience:
    raid: { caravan-master: { caution: 0.05 }, guard: { caution: 0.04 } }
    caught: { any: { honesty: 0.1, caution: 0.1 } }
    released: { any: { honesty: 0.05 } }
    lost-work: { any: { greed: 0.02 } }
    died: { widowed: { caution: 0.03 }, child: { caution: 0.02 } }
    smuggling: { smuggler: { caution: 0.08 } }


# Canonical history (PR6). Each kind: [category, importance 1-5, visibility].
# Importance 5 is life-defining, 3-4 important, 1-2 minor; routine months record nothing.
history:
  timelineMinImportance: 3      # events at or above this stay on a person's permanent timeline
  recentEvents: 24              # the per-person recent-events cache (the archive keeps everything)
  default: [settlement, 2, settlement]
  kinds:
    harvest-shortfall: [settlement, 4, public]
    household-hardship: [wealth, 4, settlement]
    hardship-relieved: [wealth, 3, settlement]
    born: [birth, 5, household]
    upbringing: [birth, 2, private]
    promoted: [birth, 1, private]
    came-of-age: [birth, 2, household]
    married: [family, 5, settlement]
    widowed: [family, 5, household]
    died: [health, 5, settlement]
    apprenticeship-started: [education, 3, participants]
    apprenticeship-completed: [education, 3, participants]
    hired: [career, 3, participants]
    first-job: [career, 3, private]
    lost-work: [career, 3, household]
    retired: [career, 3, household]
    trader: [career, 4, settlement]
    dismissed: [career, 4, settlement]
    opened: [wealth, 3, settlement]
    closed: [wealth, 3, settlement]
    moved: [travel, 4, settlement]
    departed: [travel, 3, settlement]
    migration-arrived: [travel, 2, settlement]
    travel-delayed: [travel, 3, participants]
    caravan-delayed: [travel, 3, participants]
    travel-returning: [travel, 3, participants]
    travel-returned: [travel, 4, settlement]
    raid: [conflict, 4, settlement]
    outlaw: [crime, 4, settlement]
    caught: [crime, 4, settlement]
    released: [crime, 3, household]
    smuggling: [crime, 4, settlement]
    friendship: [social, 2, participants]
    rivalry: [social, 3, participants]
    lost-parent: [family, 4, private]
    met-player: [social, 3, participants]

# Events a designer injects into a scenario (PR8). Each is canonical history with source
# "intervention"; its consequences then run through the normal simulation.
interventions:
  disaster:                     # a business is lost at once: its workers lose work, its output stops
    category: settlement
    importance: 5
    visibility: public
    causes: { collapse: collapsed, fire: burned down, flood: was flooded }
  granary-loss:                 # blight or rats spoil part of a town's food store
    category: settlement
    importance: 5
    visibility: public
  bandit-surge:                 # more outlaws gather on one road or sea lane
    category: crime
    importance: 4
    visibility: public
